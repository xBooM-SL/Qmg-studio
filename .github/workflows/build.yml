name: Build APK
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.txt'
      - '*.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version (1.0 -> 1.1 ... 1.9 -> 2.0)
        id: ver
        run: |
          OLD=$(tr -d ' \r\n' < version.txt)
          MAJOR=${OLD%%.*}
          MINOR=${OLD##*.}
          MINOR=$((MINOR + 1))
          if [ "$MINOR" -gt 9 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi
          NEW="${MAJOR}.${MINOR}"
          echo "$NEW" > version.txt
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Version: $OLD -> $NEW"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/QmgStudio-v${{ steps.ver.outputs.version }}.apk"

      - name: Verify APK signature (build fails if the APK is not installable)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/34.0.0"
          APK="dist/QmgStudio-v${{ steps.ver.outputs.version }}.apk"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK" || "$BT/zipalign" -c 4 "$APK"
          "$BT/aapt2" dump badging "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: QmgStudio-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Qmg Studio v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true

      - name: Save new version to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: version ${{ steps.ver.outputs.version }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
